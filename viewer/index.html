<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnpoint Viewer</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
      #banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: #b91c1c;
        color: white;
        text-align: center;
        font: 600 13px/1.6 system-ui, sans-serif;
        padding: 4px;
      }
      #status {
        position: fixed;
        bottom: 8px;
        left: 8px;
        z-index: 10;
        background: rgba(255, 255, 255, 0.9);
        padding: 6px 10px;
        border-radius: 4px;
        font: 13px system-ui, sans-serif;
        max-width: 60%;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      Turnpoint is a demonstration and test environment. Not for operational use.
    </div>
    <div id="map"></div>
    <div id="status">Loading...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
